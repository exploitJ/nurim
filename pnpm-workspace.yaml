packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  '@better-auth/expo': ^1.4.7
  '@eslint/js': ^9.39.2
  '@tailwindcss/postcss': ^4.1.18
  '@tailwindcss/vite': ^4.1.16
  '@tanstack/react-form': ^1.27.6
  '@tanstack/react-query': ^5.90.12
  '@trpc/client': ^11.8.1
  '@trpc/server': ^11.8.1
  '@trpc/tanstack-react-query': ^11.8.1
  '@types/node': ^24.10.4
  better-auth: 1.4.7
  eslint: ^9.39.2
  prettier: ^3.7.4
  tailwindcss: ^4.1.18
  typescript: ^5.9.3
  vite: ^7.1.12
  zod: ^4.2.1

catalogs:
  react19:
    '@types/react': ~19.1.0
    '@types/react-dom': ~19.1.0
    react: ~19.1.4
    react-dom: ~19.1.4

linkWorkspacePackages: true

onlyBuiltDependencies:
  - bufferutil
  - core-js-pure
  - esbuild
  - sharp
  - unrs-resolver

overrides:
  lightningcss: 1.30.1

peerDependencyRules:
  ignoreMissing:
    - '@prettier/plugin-oxc'

publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
